<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anonymous Fishbowl</title>
<style>
:root{--bg:#07111f;--panel:rgba(20,35,55,.72);--text:#eef7ff;--muted:#9db2c8;--accent:#67d8ff;--line:rgba(255,255,255,.12)}
.light{--bg:#eef7fb;--panel:rgba(255,255,255,.82);--text:#102033;--muted:#60758a;--line:rgba(0,0,0,.1)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#153a55 0,#07111f 48%,#030810 100%);color:var(--text);font-family:Inter,system-ui,sans-serif;display:flex;justify-content:center}.light body{background:#eef7fb}
.app{width:min(100%,1050px);padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:800}.sub{color:var(--muted);font-size:13px}.card{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(18px);border-radius:24px;padding:24px;box-shadow:0 18px 60px #0005}.screen{margin-top:22px}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}button,input,textarea{font:inherit}button{border:0;border-radius:14px;padding:12px 16px;background:#dff7ff;color:#062033;font-weight:800;cursor:pointer}button.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}input,textarea{width:100%;border:1px solid var(--line);background:#071827aa;color:var(--text);padding:13px;border-radius:14px;outline:none}textarea{min-height:100px;resize:vertical}.row{display:flex;gap:10px;flex-wrap:wrap}.center{text-align:center}.count{font-size:46px;font-weight:900}.fishbowl{width:min(470px,90vw);height:330px;margin:20px auto;border:3px solid #b9edff77;border-radius:50% 50% 44% 44%;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 20%,#b9edff18,transparent 45%),linear-gradient(#7adfff0d,#1d9bd51c);box-shadow:inset 0 0 50px #6edcff22,0 0 50px #56d9ff15}.water{position:absolute;bottom:0;width:100%;height:43%;background:#42cfff12;border-top:1px solid #8feaff33}.bubble{position:absolute;border:1px solid #bff5ff55;border-radius:50%;animation:up 5s infinite}.b1{left:22%;bottom:20%;width:15px;height:15px}.b2{left:70%;bottom:12%;width:9px;height:9px;animation-delay:1s}.fish{position:absolute;font-size:38px;animation:swim 6s ease-in-out infinite}.f1{top:36%;left:18%}.f2{top:57%;left:62%;animation-delay:1.5s}.f3{top:22%;left:55%;font-size:28px;animation-delay:3s}@keyframes swim{50%{transform:translate(80px,-20px) rotate(-4deg)}100%{transform:translate(0)}}@keyframes up{to{transform:translateY(-220px);opacity:0}}.question{font-size:27px;line-height:1.25;font-weight:800;margin:18px auto;max-width:720px}.answer{flex:1;min-width:130px;font-size:18px}.yes{background:#baf5cf}.no{background:#ffc1c1}.other{background:#ffe7a7}.results{display:grid;grid-template-columns:1fr 1fr;gap:14px}.result{padding:18px;border:1px solid var(--line);border-radius:18px}.num{font-size:34px;font-weight:900}.notice{color:var(--muted);margin:12px 0}.room{font-size:34px;letter-spacing:5px;font-weight:900}.small{font-size:12px;color:var(--muted)}@media(max-width:700px){.grid,.results{grid-template-columns:1fr}.app{padding:14px}.card{padding:18px}.question{font-size:22px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><div class="brand">🐟 Anonymous Fishbowl</div><div class="sub">Ask anything. Answer honestly. Stay anonymous.</div></div><button class="secondary" id="theme">☼</button></div>

  <section id="home" class="screen">
    <div class="card center">
      <h1>Anonymous social game</h1><p class="notice">Create a private room for 2–8 players.</p>
      <div class="row" style="justify-content:center"><button id="create">Create Room</button><button class="secondary" id="showJoin">Join Room</button></div>
      <div id="joinBox" class="hidden" style="max-width:380px;margin:20px auto"><input id="roomInput" placeholder="Enter room code"><br><br><button id="join">Join</button></div>
    </div>
  </section>

  <section id="lobby" class="screen hidden">
    <div class="grid">
      <div class="card center"><div class="small">ROOM CODE</div><div class="room" id="roomCode">------</div><p>Share this code with your friends.</p><div class="count" id="playerCount">1</div><div class="small">PLAYERS</div></div>
      <div class="card"><h2>🐟 Add questions</h2><textarea id="questionInput" placeholder="Ask an anonymous question..."></textarea><br><br><button id="addQuestion">Put in Fishbowl</button><p id="added" class="notice"></p><button id="start" class="secondary">Start Game</button><button id="skip" class="secondary hidden">Skip Question</button></div>
    </div>
  </section>

  <section id="game" class="screen hidden">
    <div class="card center">
      <div class="small" id="phaseText">FISHBOWL</div>
      <div class="fishbowl"><div class="fish f1">🐠</div><div class="fish f2">🐟</div><div class="fish f3">🐡</div><div class="bubble b1"></div><div class="bubble b2"></div><div class="water"></div></div>
      <div id="question" class="question">Waiting...</div>
      <div id="answers" class="row"></div>
      <div id="custom" class="hidden" style="max-width:600px;margin:14px auto"><input id="customInput" placeholder="Type your answer"><br><br><button id="sendOther" class="other">Submit Other</button></div>
      <div id="progress" class="notice"></div>
      <button id="skipGame" class="secondary hidden">Skip Question</button>
    </div>
  </section>

  <section id="results" class="screen hidden">
    <div class="card center"><div class="small">ANONYMOUS RESULTS</div><div id="resultQuestion" class="question"></div>
      <div class="results"><div class="result"><div>✅ YES</div><div class="num" id="yes">0</div></div><div class="result"><div>❌ NO</div><div class="num" id="no">0</div></div></div>
      <div class="result" style="margin-top:14px;text-align:left"><b>✏️ OTHER</b><ul id="others"></ul></div>
      <br><button id="next">Draw Next Question</button>
    </div>
  </section>
</div>
<script>
let ws, isHost=false, roomCode="";
const $=id=>document.getElementById(id);
function show(id){["home","lobby","game","results"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
function connect(){
  ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
  ws.onclose=()=>setTimeout(connect,1200);
  ws.onmessage=e=>handle(JSON.parse(e.data));
}
function send(m){if(ws?.readyState===1)ws.send(JSON.stringify(m))}
connect();
$("create").onclick=()=>send({type:"create"});
$("showJoin").onclick=()=>$("joinBox").classList.toggle("hidden");
$("join").onclick=()=>send({type:"join",roomCode:$("roomInput").value.trim()});
$("addQuestion").onclick=()=>{let t=$("questionInput").value.trim();if(t){send({type:"addQuestion",text:t});$("questionInput").value=""}};
$("start").onclick=()=>send({type:"start"});
$("skip").onclick=()=>send({type:"skip"});
$("skipGame").onclick=()=>send({type:"skip"});
$("next").onclick=()=>send({type:"skip"});
$("theme").onclick=()=>document.documentElement.classList.toggle("light");
$("sendOther").onclick=()=>{let v=$("customInput").value.trim();if(v){send({type:"answer",answer:v});$("customInput").value="";$("custom").classList.add("hidden");$("answers").innerHTML="Answer submitted."}};
function handle(m){
 if(m.type==="error"){alert(m.message);return}
 if(m.type==="joined"){roomCode=m.roomCode;isHost=m.host;$("roomCode").textContent=roomCode;show("lobby");$("start").classList.toggle("hidden",!isHost);$("skip").classList.toggle("hidden",!isHost);return}
 if(m.type==="state"){$("playerCount").textContent=m.playerCount;if(m.phase==="lobby")show("lobby");$("progress").textContent=`${m.answersSubmitted||0} / ${m.totalPlayers||0} answers submitted`;return}
 if(m.type==="question"){$("question").textContent=m.text;$("resultQuestion").textContent=m.text;$("answers").innerHTML='<button class="answer yes">✅ Yes</button><button class="answer no">❌ No</button><button class="answer other">✏️ Other</button>';$("answers").onclick=e=>{if(e.target.classList.contains("yes")){send({type:"answer",answer:"yes"});disableAnswers()}if(e.target.classList.contains("no")){send({type:"answer",answer:"no"});disableAnswers()}if(e.target.classList.contains("other"))$("custom").classList.remove("hidden")}};show("game");return}
 if(m.type==="drawAnimation"){$("phaseText").textContent="🐟 DRAWING FROM FISHBOWL…";show("game");return}
 if(m.type==="answerAccepted"){disableAnswers();return}
 if(m.type==="results"){$("yes").textContent=m.yes;$("no").textContent=m.no;$("others").innerHTML=m.other.map(x=>`<li>${escapeHtml(x)}</li>`).join("")||"<li>None</li>";show("results");return}
 if(m.type==="emptyFishbowl"){alert(m.message);show("lobby")}
}
function disableAnswers(){document.querySelectorAll("#answers button").forEach(b=>b.disabled=true);$("custom").classList.add("hidden")}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
</script>
</body>
</html>
