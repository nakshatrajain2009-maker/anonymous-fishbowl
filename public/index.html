<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anonymous Fishbowl</title>
<style>
:root{--bg:#08111f;--panel:#101c2f;--text:#eef5ff;--muted:#9fb0c7;--accent:#72e6ff;--accent2:#9a7cff;--line:#23344d}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 50% 15%,#18304c,#08111f 55%,#050a12);color:var(--text);min-height:100vh}.wrap{width:min(900px,94vw);margin:auto;padding:22px 0 50px}.top{display:flex;justify-content:space-between}.brand{font-weight:800}.pill{border:1px solid var(--line);background:var(--panel);padding:8px 12px;border-radius:999px}.screen{display:none}.screen.active{display:block}.card{background:#101c2fee;border:1px solid var(--line);border-radius:26px;padding:26px;box-shadow:0 20px 70px #0005}.center{text-align:center}.bowl{width:min(270px,70vw);height:min(270px,70vw);border:8px solid #8deaff55;border-radius:50%;margin:25px auto;position:relative;overflow:hidden;background:radial-gradient(circle,#ffffff06,transparent 60%);box-shadow:0 0 70px #49dfff22}.water{position:absolute;left:-10%;right:-10%;bottom:-10%;height:45%;background:#62dfff22;border-radius:50% 50% 0 0}.fish{position:absolute;font-size:40px;animation:f 3s ease-in-out infinite}.f1{left:25%;top:35%}.f2{right:22%;top:52%;animation-delay:.7s}.f3{left:45%;top:65%;animation-delay:1.2s}@keyframes f{50%{transform:translateY(-15px)}}h1{font-size:clamp(32px,7vw,56px);margin:8px 0}.sub{color:var(--muted);line-height:1.6;max-width:650px;margin:0 auto 24px}input,textarea{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:15px;background:#07111f;color:var(--text);font:inherit}textarea{min-height:100px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.btn{border:0;border-radius:15px;padding:13px 18px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06101b;font-weight:800}.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}.answers,.results{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.answer,.result{padding:20px;border-radius:18px;border:1px solid var(--line);background:#ffffff05;color:var(--text)}.answer{font-weight:800}.count{font-size:48px;font-weight:900}.question{font-size:clamp(23px,4vw,38px);line-height:1.3;margin:20px 0}.status{color:var(--muted);margin:12px}.hide{display:none!important}@media(max-width:650px){.answers,.results{grid-template-columns:1fr}.card{padding:18px}}
</style></head>
<body><div class="wrap">
<div class="top"><div class="brand">🐟 Anonymous Fishbowl</div></div>
<section id="home" class="screen active"><div class="card center"><div class="bowl"><div class="water"></div><div class="fish f1">🐠</div><div class="fish f2">🐟</div><div class="fish f3">🐡</div></div>
<h1>Ask. Answer. Stay anonymous.</h1><p class="sub">A private multiplayer fishbowl for 2–8 friends. Questions are shuffled and authors stay hidden.</p>
<div style="width:min(500px,100%)"><input id="name" maxlength="30" placeholder="Your nickname"><div class="row" style="margin-top:10px"><button class="btn" id="create">Create room</button><button class="btn secondary" id="showJoin">Join room</button></div><input id="code" class="hide" maxlength="6" placeholder="6-character room code" style="margin-top:10px;text-transform:uppercase"><button id="join" class="btn hide" style="width:100%;margin-top:10px">Join</button></div><div id="msg" class="status"></div></div></section>
<section id="lobby" class="screen"><div class="card center"><div class="pill">ROOM <b id="room"></b></div><h1>Waiting room</h1><div class="count" id="pc">0/8</div><div class="status">players connected</div><textarea id="q" maxlength="300" placeholder="Write an anonymous question..."></textarea><button class="btn" id="add" style="margin-top:10px;width:100%">Put question in fishbowl</button><div class="row" style="margin-top:12px"><button class="btn" id="start">Start game</button><button class="btn secondary" id="copy">Copy room link</button></div><div id="lm" class="status"></div></div></section>
<section id="game" class="screen"><div class="card center"><div class="pill" id="remaining"></div><div class="bowl"><div class="water"></div><div class="fish f1">🐠</div><div class="fish f2">🐟</div></div><div class="question" id="qt"></div><div id="answers"><div class="answers"><button class="answer" data-c="yes">YES</button><button class="answer" data-c="no">NO</button><button class="answer" data-c="other">OTHER</button></div><div id="other" class="hide" style="margin-top:10px"><input id="ot" maxlength="120" placeholder="Your answer"><button class="btn" id="os" style="width:100%;margin-top:8px">Submit</button></div></div><div id="wait" class="status hide">Answer submitted. Waiting for everyone…</div><button id="skip" class="btn secondary hide">Skip question</button></div></section>
<section id="res" class="screen"><div class="card center"><h1>Results</h1><div class="results"><div class="result"><div class="count" id="yc">0</div>YES</div><div class="result"><div class="count" id="nc">0</div>NO</div><div class="result"><div class="count" id="oc">0</div>OTHER</div></div><div id="ol" style="width:100%;text-align:left;margin-top:15px"></div><button id="next" class="btn hide" style="margin-top:15px">Next question</button></div></section>
</div>
<script>
const $=s=>document.querySelector(s);let ws,host=false,code="",pid=localStorage.fishPid||crypto.randomUUID();localStorage.fishPid=pid;
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$("#"+id).classList.add("active")}
function connect(c){code=c.toUpperCase();localStorage.fishRoom=code;const p=location.protocol==="https:"?"wss":"ws";ws=new WebSocket(`${p}://${location.host}/room/${code}?playerId=${encodeURIComponent(pid)}&name=${encodeURIComponent($("#name").value||"Player")}`);ws.onopen=()=>{show("lobby");$("#room").textContent=code};ws.onmessage=e=>handle(JSON.parse(e.data));ws.onerror=()=>$("#msg").textContent="Connection failed."}
function send(x){if(ws?.readyState===1)ws.send(JSON.stringify(x))}
function handle(d){if(d.type==="error"){ $("#msg").textContent=d.message;return }if(d.type==="state"){host=d.room.isHost;$("#pc").textContent=`${d.room.playerCount}/${d.room.maxPlayers}`;$("#start").disabled=!host||d.room.playerCount<2;$("#start").textContent=host?"Start game":"Waiting for host";$("#remaining").textContent=`${d.room.questionsRemaining} questions waiting`;if(d.current){$("#qt").textContent=d.current.text;$("#skip").classList.toggle("hide",!host);$("#answers").classList.toggle("hide",d.answered);$("#wait").classList.toggle("hide",!d.answered);show("game")}else if(d.room.started)show("lobby")}}
function results(d){$("#yc").textContent=d.yes;$("#nc").textContent=d.no;$("#oc").textContent=d.other.length;$("#ol").innerHTML=d.other.map(x=>`<div style="padding:10px;border-bottom:1px solid #23344d">${x.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}</div>`).join("")||"<div class='status'>No OTHER responses.</div>";$("#next").classList.toggle("hide",!host);show("res")}
ws?.addEventListener("message",e=>{const d=JSON.parse(e.data);if(d.type==="results")results(d)});
$("#create").onclick=()=>{if(!$("#name").value.trim()){$("#msg").textContent="Enter a nickname first.";return}connect(Math.random().toString(36).slice(2,8).toUpperCase())};
$("#showJoin").onclick=()=>{$("#code").classList.remove("hide");$("#join").classList.remove("hide");$("#code").focus()};
$("#join").onclick=()=>{const c=$("#code").value.trim();if(/^[A-Za-z0-9]{6}$/.test(c))connect(c);else $("#msg").textContent="Enter a 6-character code."};
$("#start").onclick=()=>send({type:"start"});$("#add").onclick=()=>{if($("#q").value.trim()){send({type:"submit_question",text:$("#q").value});$("#q").value=""}};$("#copy").onclick=()=>navigator.clipboard.writeText(location.href+"?room="+code);
document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{if(b.dataset.c==="other")$("#other").classList.remove("hide");else{send({type:"answer",choice:b.dataset.c});$("#answers").classList.add("hide");$("#wait").classList.remove("hide")}});
$("#os").onclick=()=>{if($("#ot").value.trim()){send({type:"answer",choice:"other",text:$("#ot").value});$("#answers").classList.add("hide");$("#wait").classList.remove("hide")}};$("#skip").onclick=()=>send({type:"skip"});$("#next").onclick=()=>send({type:"next"});
const saved=new URLSearchParams(location.search).get("room")||localStorage.fishRoom;if(saved)$("#code").value=saved;
</script></body></html>
